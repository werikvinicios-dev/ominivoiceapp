<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{% block title %}OmniVoice Studio{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js?v={{ version }}" defer></script>
</head>
<body hx-headers='{"X-Requested-With": "htmx"}'>

<header class="topbar">
  <div class="topbar-title">
    <img src="/static/icon.svg" alt="" width="26" height="26">
    <span>{% block heading %}OmniVoice{% endblock %}</span>
  </div>
  <div class="topbar-right">
    {% if engine and engine.mock %}
      <a class="badge badge-warn" href="/ajustes" title="Nenhum modelo carregado">simulador</a>
    {% endif %}
    <span id="queue-badge"
          hx-get="/fila"
          hx-trigger="load, every 3s, queue-changed from:body"
          hx-target="this"
          hx-swap="innerHTML"></span>
  </div>
</header>

<main class="content">
  {% block content %}{% endblock %}
</main>

<nav class="tabbar">
  <a href="/" class="tab {% if active == 'studio' %}is-active{% endif %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
    <span>Criar</span>
  </a>
  <a href="/vozes" class="tab {% if active == 'voices' %}is-active{% endif %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    <span>Vozes</span>
  </a>
  <a href="/historico" class="tab {% if active == 'history' %}is-active{% endif %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3a9 9 0 1 0 8.94 10h-2.02A7 7 0 1 1 13 5v4l5-5-5-5v4zM12 8v5l4 2 .75-1.23L13.5 12V8H12z"/></svg>
    <span>Histórico</span>
  </a>
  <a href="/ajustes" class="tab {% if active == 'settings' %}is-active{% endif %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9.4 4c0 .6-.06 1.14-.15 1.68l2.02 1.58-2 3.46-2.4-.96a7.6 7.6 0 0 1-2.9 1.68L15.6 22h-4l-.37-2.56a7.6 7.6 0 0 1-2.9-1.68l-2.4.96-2-3.46 2.02-1.58a7.7 7.7 0 0 1 0-3.36L3.93 8.74l2-3.46 2.4.96a7.6 7.6 0 0 1 2.9-1.68L11.6 2h4l.37 2.56c1.07.36 2.05.94 2.9 1.68l2.4-.96 2 3.46-2.02 1.58c.09.54.15 1.08.15 1.68z"/></svg>
    <span>Ajustes</span>
  </a>
</nav>

</body>
</html>
